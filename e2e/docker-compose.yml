# This Compose file is expected to be used with the devnet-up.sh script.
# The volumes below mount the configs generated by the script into each
# service.

volumes:
  l1_data:
  l1_bn_data:
  l1_vc_data:

services:
  l1:
    build:
      context: .
      dockerfile: l1-geth.Dockerfile
    ports:
      - "8545:8545"
      - "8546:8546"
      - "7060:6060"
    volumes:
      - "l1_data:/db"
      - "${PWD}/devnet/genesis.json:/genesis.json"
      - "${PWD}/test-jwt-secret.txt:/config/jwt-secret.txt"
    environment:
      GETH_MINER_RECOMMIT: 1000ms
      MINER_COINBASE: "0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266"
      # enable dev chain (no beacon, instant sealing)
      GETH_DEV: "true"
      GETH_DEV_PERIOD: "1"

  l1-bn:
    depends_on:
      - l1
    build:
      context: .
      dockerfile: l1-lighthouse.Dockerfile
    ports:
      - "9000:9000"
      - "5052:5052"
    volumes:
      - "l1_bn_data:/db"
      - "${PWD}/test-jwt-secret.txt:/config/jwt-secret.txt"
      - "${PWD}/beacon-data/config.yaml:/genesis/config.yaml"
      - "${PWD}/beacon-data/deposit_contract_block.txt:/genesis/deposit_contract_block.txt"
      - "${PWD}/devnet/genesis-l1.ssz:/genesis/genesis.ssz"
    environment:
      LH_EXECUTION_ENDPOINT: "http://l1:8551"
    entrypoint:
      - "/bin/sh"
      - "/entrypoint-bn.sh"

  l1-vc:
    depends_on:
      - l1
      - l1-bn
    build:
      context: .
      dockerfile: l1-lighthouse.Dockerfile
    volumes:
      - "l1_vc_data:/db"
      - "${PWD}/beacon-data/data/keys:/validator_setup/validators"
      - "${PWD}/beacon-data/data/secrets:/validator_setup/secrets"
      - "${PWD}/beacon-data/config.yaml:/genesis/config.yaml"
      - "${PWD}/beacon-data/deposit_contract_block.txt:/genesis/deposit_contract_block.txt"
      - "${PWD}/devnet/genesis-l1.ssz:/genesis/genesis.ssz"
    environment:
      LH_BEACON_NODES: "http://l1-bn:5052/"
    entrypoint:
      - "/bin/sh"
      - "/entrypoint-vc.sh"

  # Soon L2 services
  node:
    depends_on:
      - l1
    image: ${REGISTRY:-ghcr.io/soonlabs/soon-e2e}/node:${VERSION:-0.3}
    container_name: ${NODE_CONTAINER_NAME:-node}
    ports:
      - ${BIND_HOST:-127.0.0.1}:${RPC_PORT:-8899}:8899
      - ${BIND_HOST:-127.0.0.1}:${RPC_PUBSUB_PORT:-8900}:8900
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: "json-file"
      options:
        max-size: 100m
        max-file: "3"
    volumes:
      - "${PWD}/.soon:/.soon"
      - "${PWD}/ethereum.testnet.rollup.json:/.soon/rollup.json"
    environment:
      RUST_LOG: info,hyper=warn,alloy=warn,tonic=warn,h2=warn,tower=warn
      SOON_NODE_STORAGE_PATH: /.soon
      SOON_NODE_ROLLUP_CONFIG_PATH: /.soon/rollup.json
      SOON_NODE_L1_RPC_URL: http://l1:8545
      SOON_NODE_SCHEDULER_WORKER_NUM: 4
      SOON_NODE_NETWORK_IDENTITY: /.soon/keypair/network_identity.json
      SOON_NODE_ENABLE_SEQUENCER: true
      SOON_NODE_FULL_RPC_API: true
      SOON_NODE_RPC_PUBSUB_ENABLE_BLOCK_SUBSCRIPTION: true
      SOON_NODE_ENABLE_FAUCET: ${SOON_NODE_ENABLE_FAUCET:-true}

  batcher:
    depends_on:
      # - l1
      - node
    image: ${REGISTRY:-ghcr.io/soonlabs/soon-e2e}/batcher:${VERSION:-0.3}
    container_name: ${BATCHER_CONTAINER_NAME:-batcher}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: "json-file"
      options:
        max-size: 100m
        max-file: "3"
    restart: on-failure:5
    environment:
      RUST_LOG: info
      L1_RPC_URL: http://l1:8545
      L2_RPC_URL: http://node:8899
      ADMIN_SECRET_KEY: ${BATCHER_ADMIN_SECRET}
      DA_PROVIDER_URL: http://da-server:8080
      WAIT_HOSTS: node:8899,da-server:8080
      WAIT_TIMEOUT: 300

  da-server:
    image: ${REGISTRY:-ghcr.io/soonlabs/soon-e2e}/da-server:${VERSION:-0.3}
    container_name: ${DA_SERVER_CONTAINER_NAME:-da-server}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - ${BIND_HOST:-127.0.0.1}:${DA_SERVER_PORT:-8080}:8080
    healthcheck:
      test: [ "CMD", "curl", "http://localhost:8080/health" ]
      interval: 30s
      retries: 3
      start_period: 10s
      timeout: 3s
    logging:
      driver: "json-file"
      options:
        max-size: 100m
        max-file: "3"
    restart: on-failure:5
    environment:
      RUST_LOG: info
