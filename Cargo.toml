[workspace.package]
version = "1.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"
authors = ["hashcashier"]
homepage = "https://risc0.github.io/kailua/"
repository = "https://github.com/risc0/kailua"
keywords = ["zkvm", "ethereum", "optimism", "fault", "proof"]
categories = ["cryptography", "cryptography::cryptocurrencies"]

[workspace]
resolver = "2"
members = ["bin/cli", "build/*", "crates/*"]

[workspace.dependencies]
anyhow = "1.0.98"
async-channel = "2.3.1"
async-trait = "0.1.88"
aws-config = "1.5.15"
aws-sdk-kms = "1.58.0"
aws-sdk-s3 = "1.58.0"
bincode = "1.3.3"
bytemuck = "1.12"
c-kzg = "=2.1.1"
clap = { version = "4.5.21", features = ["derive", "env"] }
copy_dir = "0.1.3"
foundry-compilers = "0.11.0"
futures = "0.3.31"
gcloud-sdk = { version = "0.27.0", features = ["google-cloud-kms-v1"] }
hashbrown = { version = "0.15.0", features = ["rayon"] }
hex = "0.4.3"
human_bytes = "0.4.3"
itertools = "0.14.0"
lazy_static = "1.5.0"
paste = "1.0.15"
pot = "3.0.1"
rand = "0.9.2"
rayon = "1.10.0"
reqwest = { version = "0.12.3", features = ["json"] }
jsonrpsee = { version = "0.25.1", features = ["full"] }
rkyv = "0.8.9"
rocksdb = "0.23.0"
semver = "1.0.23"
serde = { version = "1.0", features = ["derive", "alloc", "std"] }
serde_json = "1.0.127"
sha2 = "0.10.8"
spin = { version = "0.10.0", features = ["mutex"] }
tempfile = "3.20.0"
thiserror = "2.0.12"
threadpool = "1.8.1"
tokio = { version = "1.39.1", features = ["full"] }
tokio-retry = "0.3.0"
url = "2.5.4"

# Telemetry
opentelemetry = "0.27.1"
opentelemetry_sdk = { version = "0.27.1", features = ["rt-tokio"] }
opentelemetry-semantic-conventions = "0.27.0"
opentelemetry-otlp = { version = "0.27.0", features = ["tonic"] }
opentelemetry-prometheus = "0.27.0"
opentelemetry-zipkin = "0.27.0"
tracing = "0.1.40"
tracing-opentelemetry = "0.28.0"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Alloy
alloy = { version = "1.0.9", default-features = false, features = ["json"] }
alloy-consensus = { version = "1.0.9", default-features = false, features = ["serde"] }
alloy-eips = { version = "1.0.9", default-features = false, features = [
    "kzg",
] }
alloy-evm = { version = "0.10.0", default-features = false, features = ["op"] }
alloy-op-evm = { version = "0.10.0", default-features = false }
alloy-provider = { version = "1.0.9" }
alloy-rlp = "0.3.12"
alloy-primitives = { version = "1.3.1", default-features = false, features = [
    "map-hashbrown",
] }
alloy-rpc-types-beacon = "1.0.9"
alloy-rpc-types-engine = { version = "1.0.9", default-features = false }

# OP Alloy
op-alloy-consensus = { version = "0.17.2", default-features = false, features = [
    "serde",
] }
op-alloy-rpc-types-engine = { version = "0.17.2", default-features = false, features = [
    "serde",
] }
op-alloy-network = { version = "0.17.2", default-features = false, features = ["serde"] }

# Kailua
kailua-build = { path = "build/risczero" }
kailua-contracts = { path = "crates/contracts" }
kailua-soon-kona = { path = "crates/kona" }
kailua-proposer = { path = "crates/proposer" }
kailua-prover = { path = "crates/prover" }
kailua-rpc = { path = "crates/rpc" }
kailua-sync = { path = "crates/sync" }
kailua-validator = { path = "crates/validator" }

# Kona
kona-cli = { git = "https://github.com/soonlabs/kona-soon", branch = "dev", default-features = false }
kona-driver = { git = "https://github.com/soonlabs/kona-soon", branch = "dev" }
kona-executor = { git = "https://github.com/soonlabs/kona-soon", branch = "dev" }
kona-host = { git = "https://github.com/soonlabs/kona-soon", branch = "dev", default-features = false, features = [
    "single",
] }
kona-mpt = { git = "https://github.com/soonlabs/kona-soon", branch = "dev", features = ["serde"] }
kona-preimage = { git = "https://github.com/soonlabs/kona-soon", branch = "dev", features = [
    "serde",
    "rkyv",
    "std",
] }
kona-proof = { git = "https://github.com/soonlabs/kona-soon", branch = "dev" }
kona-std-fpvm = { git = "https://github.com/soonlabs/kona-soon", branch = "dev" }
fraud-executor = { git = "https://github.com/soonlabs/kona-soon", branch = "dev" }
litesvm = { git = "https://github.com/soonlabs/kona-soon", branch = "dev" }

# SOON
soon-primitives = { git = "https://github.com/soonlabs/kona-soon", branch = "dev" }
soon-derive = { git = "https://github.com/soonlabs/kona-soon", branch = "dev" }
soon-l2-chain-provider = { git = "https://github.com/soonlabs/kona-soon", branch = "dev" }

# Bonsai
bonsai-sdk = { version = "1.4.0", features = ["non_blocking"] }

# RISC Zero
risc0-build = { version = "3.0.3", features = ["unstable"] }
risc0-circuit-recursion = "4.0.2"
risc0-ethereum-contracts = "3.0.1"
risc0-zkvm = { version = "3.0.3", features = ["heap-embedded-alloc", "unstable"] }

# Boundless
boundless-market = "1.0.0"

# STEEL
risc0-steel = { git = "https://github.com/boundless-xyz/steel.git", tag = "v2.4.0" }

# for testing
solana-sdk = { git = "https://github.com/soonlabs/agave", branch = "feat/risc0-zkvm" }
solana-program = { git = "https://github.com/soonlabs/agave", branch = "feat/risc0-zkvm" }
l1-block-info = { git = "https://github.com/soonlabs/kona-soon", branch = "dev", features = [
    "no-entrypoint",
] }
bridge = { git = "https://github.com/soonlabs/kona-soon", branch = "dev", features = [
    "no-entrypoint",
] }
spl-token = "=6.0.0"
crossbeam-channel = "0.5.11"

[profile.dev]
opt-level = 3


[profile.release]
codegen-units = 1
debug = 1
lto = "fat"
overflow-checks = true

[profile.release.build-override]
codegen-units = 1
opt-level = 3

[patch."https://github.com/soonlabs/kona-soon"]
# Local kona dependencies for testing (uncomment to use local paths)
# kona-cli = { path = "../kona-soon/crates/utilities/cli" }
